name: Release OpenSSL Platform Reusable

on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      build_mode:
        required: true
        type: string
      matrix_json:
        required: false
        type: string
        default: '{"include":[]}'
      openssl_version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      release_name:
        required: true
        type: string
      ndk_version:
        required: false
        type: string
        default: r25c

permissions:
  contents: write

env:
  CPM_SOURCE_CACHE: .cpm

jobs:
  build-presets:
    if: ${{ inputs.build_mode == 'preset' }}
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix_json) }}
    env:
      OPENSSL_VERSION: ${{ inputs.openssl_version }}
      INSTALL_DIR: ${{ github.workspace }}/install/${{ matrix.preset }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: release-${{ env.OPENSSL_VERSION }}-cpm-${{ runner.os }}
          enableCrossOsArchive: true

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build perl ccache

      - name: Set up Android NDK
        if: startsWith(matrix.preset, 'android-')
        id: android-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ inputs.ndk_version }}

      - name: Export Android NDK path
        if: startsWith(matrix.preset, 'android-')
        shell: bash
        run: echo "ANDROID_NDK=${{ steps.android-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install perl ccache

      - name: Install dependencies on Windows
        if: runner.os == 'Windows'
        run: |
          choco install -y jom nasm strawberryperl
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '--preset', '${{ matrix.preset }}',
            '-DCPM_SOURCE_CACHE=${{ github.workspace }}/${{ env.CPM_SOURCE_CACHE }}',
            '-DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_DIR }}',
            '-DOPENSSL_TARGET_VERSION=${{ env.OPENSSL_VERSION }}',
            '-DOPENSSL_BUILD_VERBOSE=ON',
            '-DOPENSSL_CONFIGURE_VERBOSE=ON'
          )
          & cmake @cmakeArgs

      - name: Configure CMake on Unix-like runners
        if: runner.os != 'Windows'
        shell: bash
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCPM_SOURCE_CACHE=${{ github.workspace }}/${{ env.CPM_SOURCE_CACHE }}
          -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_DIR }}
          -DOPENSSL_TARGET_VERSION=${{ env.OPENSSL_VERSION }}
          -DOPENSSL_BUILD_VERBOSE=ON
          -DOPENSSL_CONFIGURE_VERBOSE=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config Release

      - name: Install
        shell: bash
        run: |
          cmake --install "build/${{ matrix.preset }}" --config Release --prefix "${INSTALL_DIR}"
          test -d "${INSTALL_DIR}"

      - name: Package artifact on Unix-like runners
        if: runner.os != 'Windows'
        shell: bash
        run: |
          asset_name="openssl-${OPENSSL_VERSION}-${{ matrix.preset }}.${{ matrix.archive_ext }}"
          mkdir -p release
          tar -C "${INSTALL_DIR}" -czf "release/${asset_name}" .

      - name: Package artifact on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $assetName = "openssl-${env:OPENSSL_VERSION}-${{ matrix.preset }}.${{ matrix.archive_ext }}"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path "${env:INSTALL_DIR}/*" -DestinationPath "release/$assetName" -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.platform_name }}-${{ matrix.preset }}
          path: release/*
          if-no-files-found: error

  publish-presets:
    if: ${{ inputs.build_mode == 'preset' }}
    name: publish-${{ inputs.platform_name }}
    needs: build-presets
    runs-on: ubuntu-latest
    env:
      OPENSSL_VERSION: ${{ inputs.openssl_version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_NAME: ${{ inputs.release_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: release-${{ inputs.platform_name }}-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS-${{ inputs.platform_name }}.txt

      - name: Publish release assets
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --title "$RELEASE_NAME" \
              --notes "OpenSSL release artifacts for $OPENSSL_VERSION." || true
          fi

          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GH_REPO" --clobber

  build-freebsd:
    if: ${{ inputs.build_mode == 'freebsd' }}
    name: freebsd
    runs-on: ubuntu-latest
    env:
      OPENSSL_VERSION: ${{ inputs.openssl_version }}
      INSTALL_DIR: ${{ github.workspace }}/install/freebsd
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: release-${{ env.OPENSSL_VERSION }}-cpm-freebsd
          enableCrossOsArchive: true

      - uses: cross-platform-actions/action@v1
        with:
          operating_system: freebsd
          architecture: x86_64
          version: "15.0"
          memory: 8G
          run: |
            sudo pkg install -y cmake perl5 ninja
            cmake -B build/freebsd -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCPM_SOURCE_CACHE=${{ env.CPM_SOURCE_CACHE }} \
              -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_DIR }} \
              -DOPENSSL_INSTALL=ON \
              -DOPENSSL_TARGET_VERSION=${{ env.OPENSSL_VERSION }}
            cmake --build build/freebsd -t install
            mkdir -p release
            tar -C ${{ env.INSTALL_DIR }} -czf release/openssl-${{ env.OPENSSL_VERSION }}-freebsd.tar.gz .

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.platform_name }}
          path: release/*
          if-no-files-found: error

  publish-freebsd:
    if: ${{ inputs.build_mode == 'freebsd' }}
    name: publish-${{ inputs.platform_name }}
    needs: build-freebsd
    runs-on: ubuntu-latest
    env:
      OPENSSL_VERSION: ${{ inputs.openssl_version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_NAME: ${{ inputs.release_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          name: release-${{ inputs.platform_name }}

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS-${{ inputs.platform_name }}.txt

      - name: Publish release assets
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --title "$RELEASE_NAME" \
              --notes "OpenSSL release artifacts for $OPENSSL_VERSION." || true
          fi

          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GH_REPO" --clobber

  build-mingw64:
    if: ${{ inputs.build_mode == 'mingw64' }}
    name: mingw64
    runs-on: windows-latest
    env:
      OPENSSL_VERSION: ${{ inputs.openssl_version }}
      INSTALL_DIR: ${{ github.workspace }}/install/mingw64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          pacboy: >-
            cmake:p
            gcc:p
            make:p
            ninja:p
            perl:p

      - name: Configure CMake
        run: |
          cmake -B build/mingw64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPM_SOURCE_CACHE="$PWD/${CPM_SOURCE_CACHE}" \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
            -DOPENSSL_INSTALL=ON \
            -DOPENSSL_TARGET_VERSION="${OPENSSL_VERSION}" \
            -DOPENSSL_BUILD_VERBOSE=ON \
            -DOPENSSL_CONFIGURE_VERBOSE=ON

      - name: Build and install
        run: cmake --build build/mingw64 -t install

      - name: Package artifact
        run: |
          mkdir -p release
          tar -C "${INSTALL_DIR}" -czf "release/openssl-${OPENSSL_VERSION}-mingw64.tar.gz" .

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.platform_name }}
          path: release/*
          if-no-files-found: error

  publish-mingw64:
    if: ${{ inputs.build_mode == 'mingw64' }}
    name: publish-${{ inputs.platform_name }}
    needs: build-mingw64
    runs-on: ubuntu-latest
    env:
      OPENSSL_VERSION: ${{ inputs.openssl_version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_NAME: ${{ inputs.release_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          name: release-${{ inputs.platform_name }}

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS-${{ inputs.platform_name }}.txt

      - name: Publish release assets
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --title "$RELEASE_NAME" \
              --notes "OpenSSL release artifacts for $OPENSSL_VERSION." || true
          fi

          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GH_REPO" --clobber